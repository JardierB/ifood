version: '3.7'
services:
     postgres_cadastro:
          container_name: db_ifood
          restart: always
          image: postgres:12.2
          environment:
               POSTGRES_USER: cadastro
               POSTGRES_PASSWORD: cadastro
               POSTGRES_DB: ifood
          ports:
               - "5432:5432"  
# Banco do marketplace
     postgres_marketplace:
          container_name: db_marketplace_ifood
          restart: always
          image: postgres:12.2
          environment:
               POSTGRES_USER: marketplace
               POSTGRES_PASSWORD: marketplace
               POSTGRES_DB: marketplace
          ports:
               - "5433:5432"  

#Banco do Peido com MongoDB               
     mongo_pedido:
          container_name: db_pedido_ifood
          restart: always
          image: mongo:4.2.5-bionic
          environment:
              MONGO_INITDB_ROOT_USERNAME: pedido
              MONGO_INITDB_ROOT_PASSWORD: pedido
          ports:
               - "27017:27017"  
