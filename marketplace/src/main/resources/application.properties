quarkus.http.port=8081


# Datasource PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=marketplace
quarkus.datasource.password=marketplace

# Cliente reativo - aplicação
quarkus.datasource.reactive.url=postgresql://localhost:5433/marketplace

# JDBC - Flyway
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/marketplace

# Flyway
quarkus.flyway.locations=db/migration
quarkus.flyway.clean-at-start=false
quarkus.flyway.migrate-at-start=true


# ActiveMQ Artemis - AMQP
mp.messaging.connector.smallrye-amqp.host=localhost
mp.messaging.connector.smallrye-amqp.port=5672
mp.messaging.connector.smallrye-amqp.username=admin
mp.messaging.connector.smallrye-amqp.password=admin

# Canal de entrada
mp.messaging.incoming.restaurantes.connector=smallrye-amqp
mp.messaging.incoming.restaurantes.address=restaurante-adicionado



