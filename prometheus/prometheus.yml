
# my global config
global:
  scrape_interval: 5s
  evaluation_interval: 15s
  scrape_protocols:
    - OpenMetricsText1.0.0

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: "ifood-cadastro"
    metrics_path: "/q/metrics"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          app: "ifood-cadastro"