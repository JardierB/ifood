version: '3.7'
services:
     postgres_cadastro:
          container_name: db_ifood_cadastro
          restart: always
          image: postgres:12.2
          environment:
               POSTGRES_USER: cadastro
               POSTGRES_PASSWORD: cadastro
          ports:
               - "5432:5432"
     keycloak_ifood:
          container_name: keycloak_ifood
          image: quay.io/keycloak/keycloak:26.8.1
          environment:
               KC_BOOTSTRAP_ADMIN_USERNAME: admin
               KC_BOOTSTRAP_ADMIN_PASSWORD: admin
          ports:
               - "8180:8080"
          command: start-dev
